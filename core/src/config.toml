# secmon sample config file
# [hub] section is used when launching `secmon hub`
# [node] section is used when launching `secmon node`
# [client] section is used when using utility commands

# ============================================================
[hub]
bind_ip = "127.0.0.1"
bind_port = 9992

# time before a disconnected node is removed, if not replaced
disconnect_grace_period = 300         # in seconds

# replace a disconnected node if it reconnects with the same hostname
# otherwise treat all new connections as new nodes
assume_hostname_unique = true

# ============================================================
[node]
hub_ip = "127.0.0.1"
hub_port = 9992

# if disconnected from hub, whether to automatically reconnect
reconnect = true

# optional custom hostname; if left empty, system hostname is used
# should not start with '-' which can conflict with command line options
hostname = ""

# resources to monitor and report
# who = active login sessions
# wg = active wireguard sessions
# auth = ssh and su activity
resources = ["who", "wg", "auth"]

# time to wait when executing a command, before killing the child process
command_execute_timeout = 0         # in seconds; use 0 to disable

# label-command pairs for whitelisted commands
# label should not start with '-' which can conflict with command line options
[node.command_allowlist]
update = "apt update -y"
reboot = "shutdown -r"


# ============================================================
[client]
# time to wait when node is executing a command, before aborting execution
node_wait_timeout = 0                # in seconds; use 0 to disable
