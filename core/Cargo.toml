[package]
name = "secmon"
version = "2.0.0"
edition = "2024"
default-run = 'secmon'

[dependencies]
anyhow = "1.0.102"
base64 = "0.23.1"
chrono = "0.4.44"
colored = "3.1.1"
crossbeam-channel = "0.5.15"
gethostname = "1.1.0"
getrandom = "0.4.3"
libc = "0.2.186"
paste = "1.0.15"
postcard = {version = "1.1.3", features = ["use-std"]}
serde = "1.0.228"
shlex = "1.3.0"
snow = "0.10.0"
toml = "1.1.8"
users = "0.11.0"
wait-timeout = "0.2.1"
